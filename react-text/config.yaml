title: "プログラミング未経験から始める React"
summary: |
  プログラミングを一度もやったことがない人向けの React 入門書です。
  「Web ページが表示される仕組み」から始めて、HTML・CSS・JavaScript を学び、
  React でアプリを作れるようになるところまでを扱います。

  環境構築やエラーで止まらないよう、生成 AI にサポートしてもらいながら学ぶ構成にしています。
  第0章で AI の準備をしてから読み進めてください。

  各章は 2.2.1 のように細かく番号を振ってあります。
  詰まったときは章番号を AI に伝えるだけで、ちょうどよい助けが得られます。
