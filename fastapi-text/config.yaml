title: "プログラミング未経験から始める FastAPI"
summary: |
  Python を学び終えた人向けの、Web API 入門書です。
  HTTP の基礎から始めて、FastAPI でエンドポイントを作り、
  Pydantic によるバリデーション、データベース連携、認証、テストまでを扱います。
  最後に React のアプリと接続して、Web アプリを完成させます。

  生成 AI にサポートしてもらいながら学ぶ構成です。
