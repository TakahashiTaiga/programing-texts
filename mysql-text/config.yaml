title: "プログラミング未経験から始める MySQL"
summary: |
  Web アプリのデータを支えるデータベースの入門書です。
  SQL の基本から始めて、テーブル設計、結合と集計、インデックスと実行計画までを扱い、
  最後に FastAPI から実際に使うところまで進みます。

  この本を終えると、React + FastAPI + MySQL を Docker で動かす Web アプリが一人で作れます。
